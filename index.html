<style id="premium-v2">body{font-family:Manrope,Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(circle at 20% 10%,color-mix(in srgb,var(--accent) 10%,#f3f4f6),#eceef2)}#chatHeader,#local,#incoming h2,#login h1{animation:none!important}#connect:after,#login:before,#login:after{display:none!important}#login{background:#fff;padding:0;justify-content:flex-start}.login-hero{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:calc(28px + env(safe-area-inset-top,0px)) 28px 56px;color:#fff;background:linear-gradient(165deg,var(--header-from),var(--header-mid))}.login-mark{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;background:#ffffff24;border:1px solid rgba(255,255,255,.25);flex-shrink:0}#login h1{margin:0;text-align:left;font-size:32px;font-weight:800;line-height:1.1;letter-spacing:-.03em;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff;-webkit-text-fill-color:#fff}#login h1:before{content:none}.login-hero p{margin:10px 0 0;max-width:30ch;font-size:15px;line-height:1.5;color:#fffc}.login-sheet{flex-shrink:0;background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;padding:28px 24px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px #0f172a24}.login-sheet label{display:block;margin:0 0 6px 2px;font-size:13px;font-weight:600;color:#475569}#login input{width:100%;height:52px;margin-bottom:16px;padding:0 16px;border-radius:14px;border:1px solid #e2e8f0;background:#f8fafc;color:#0f172a}#login input::placeholder{color:#94a3b8}#login input:focus{outline:none;transform:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}#connect{display:flex;align-items:center;justify-content:center;width:100%;height:52px;padding:0;border:0;border-radius:16px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--header-mid),var(--header-to));box-shadow:0 10px 24px color-mix(in srgb,var(--header-mid) 32%,transparent)}#connect:hover{transform:none}#loginStatus{margin-top:14px;font-size:13px;color:#64748b}@media(max-height:560px){.login-hero p{display:none}}#chatHeader{padding-left:12px;padding-right:12px}#chatHeader>div:last-child{gap:8px}#dpBtn{width:42px;height:42px;box-shadow:0 0 0 2px #ffffff47}#partnerName{font-size:16px;font-weight:700;letter-spacing:-.01em}#status{font-size:12px;opacity:.85}#scrollBottom,#menuBtn{width:38px;height:38px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#ffffff24;border:1px solid rgba(255,255,255,.22)}#scrollBottom{overflow:visible!important}#scrollBottom .rui-ripple{display:none}#menu{width:13rem;border-radius:16px;overflow:hidden}#menu button{padding:14px 16px;font-size:14.5px;border-color:#0f172a0f}#messages{scrollbar-color:color-mix(in srgb,var(--accent) 35%,transparent) transparent}#messages::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--accent) 30%,transparent)}#messages .bubble{border:0;border-radius:18px;padding-left:12px;padding-right:12px;font-size:15px;line-height:1.42;box-shadow:0 1px 2px #0f172a1a!important}#messages .bubble:hover{transform:none}#messages .bubble.sent{border-bottom-right-radius:6px}#messages .bubble.received{border-bottom-left-radius:6px}#messages .bubble>.msg-meta.abs{right:12px}.bubble img,.bubble video{border-radius:12px}.date-sep{background:#ffffffc7;color:#475569;font-weight:600;font-size:11.5px;letter-spacing:0;box-shadow:0 1px 3px #0f172a14}#messages>button{color:var(--accent)!important;border-color:color-mix(in srgb,var(--accent) 30%,transparent)!important}.select-row{background:color-mix(in srgb,var(--accent) 12%,transparent)}.msg-check.checked{background:var(--accent);border-color:var(--accent)}#replyBox{border-left-color:var(--accent);border-radius:14px}#replyBox .text-teal-700{color:var(--accent)}.reply-preview{border-left-color:var(--accent)!important;border-radius:8px}#composer{gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))!important}#composer #message{field-sizing:content;min-height:44px;max-height:120px;padding:11px 16px;border-radius:24px;line-height:1.35;border-color:#0f172a1a!important}#emojiBtn{width:42px;height:42px;background:transparent;box-shadow:none}#send{width:44px;height:44px}#emojiTray{padding:8px 12px;background:#ffffffeb;gap:4px}#emojiTray button{width:40px;height:40px;border-radius:12px}#emojiTray button:active{background:#f1f5f9}#actions{align-items:flex-end}#actions>div{width:calc(100% - 20px);max-width:420px;margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));border-radius:22px;animation:sheetUp .3s var(--ease)}#actions>div button{padding:15px 20px;font-size:15.5px;border-color:#0f172a0f}#themeModal>div,#colors>div{border-radius:22px}#downloadBtn{background:var(--accent)}#dpViewerChange{background:var(--accent)!important}#local{border-radius:16px}#callName,#caller{font-weight:700;letter-spacing:-.01em}#callName{font-size:20px}#callState{font-size:14px;opacity:.75}@keyframes sheetUp{0%{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}.send-error{margin-top:2px;font-size:12px;font-weight:600;text-decoration:underline;cursor:pointer}</style>
